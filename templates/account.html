{% extends "base.html" %}
{% block title %}账号设置 · 助学题库{% endblock %}

{% block content %}
<section class="auth-wrap">
  <div class="auth-card auth-card-wide">
    <h1>账号设置</h1>
    <p class="muted">修改用户名或密码。修改密码时需验证当前密码；若不改密码，新密码两栏留空即可。</p>

    <form method="post" class="stack-form">
      <label>
        用户名
        <input type="text" name="username" required maxlength="64"
               value="{{ current_user.username }}" autocomplete="username">
      </label>

      <label>
        当前密码（必填，用于验证身份）
        <input type="password" name="current_password" required autocomplete="current-password">
      </label>

      <label>
        新密码（不修改请留空）
        <input type="password" name="new_password" minlength="6" autocomplete="new-password"
               placeholder="至少 6 位">
      </label>

      <label>
        确认新密码
        <input type="password" name="confirm_password" minlength="6" autocomplete="new-password"
               placeholder="再次输入新密码">
      </label>

      <button type="submit" class="btn btn-block">保存修改</button>
    </form>
  </div>
</section>
{% endblock %}
