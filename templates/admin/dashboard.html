{% extends "base.html" %}
{% block title %}管理后台 · 助学题库{% endblock %}

{% block content %}
<section class="admin-header">
  <div>
    <p class="eyebrow">Admin</p>
    <h1>科目管理</h1>
    <p class="muted">选择科目，管理「学习分类 / 学习内容」与「练习题」。</p>
  </div>
</section>

<section class="subject-grid admin-subject-grid">
  {% for s in subjects %}
  <a class="subject-card" href="{{ url_for('admin.subject_manage', subject_id=s.id) }}">
    <span class="subject-name">{{ s.name }}</span>
    <span class="subject-hint">管理 →</span>
  </a>
  {% endfor %}
</section>
{% endblock %}
