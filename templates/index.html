{% extends "base.html" %}
{% block title %}科目广场 · 助学题库{% endblock %}

{% block content %}
<section class="hero">
  <p class="eyebrow">助学系统</p>
  <h1>选择科目开始学习</h1>
  <p class="lead">点进科目后可进入「学习」或「练习」。学习内容与练习题由房主在后台录入。</p>
</section>

<section class="subject-grid">
  {% for s in subjects %}
  <a class="subject-card" href="{{ url_for('main.subject_home', slug=s.slug) }}">
    <span class="subject-name">{{ s.name }}</span>
    <span class="subject-hint">进入 →</span>
  </a>
  {% endfor %}
</section>
{% endblock %}
